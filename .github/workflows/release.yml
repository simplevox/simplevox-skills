name: Publish skill release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing package tag to publish or verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: skill-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Publish the tagged, prebuilt artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/publish_release.py
